<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b4dd8">
  <title>技能試験クリスエス 因子マネージャー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>技能試験クリスエス<br>因子マネージャー</h1>
  <p>曾祖父母候補を選んで保存するシンプル版</p>
</header>
<main>
  <section class="card"><h2>マイル側</h2><div id="mile-slots"></div></section>
  <section class="card"><h2>追込側</h2><div id="chase-slots"></div></section>
  <section class="card"><h2>自由メモ</h2><textarea id="memo" rows="4" placeholder="衣装違い、代替候補、白因子のメモなど"></textarea></section>
  <button id="save-button" class="primary">保存する</button>
  <p id="save-message" aria-live="polite"></p>
  <section class="card">
    <div class="title-row"><h2>保存中の家系図</h2><button id="reset-button" class="sub">初期化</button></div>
    <div id="summary" class="summary">まだ保存されていません。</div>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
